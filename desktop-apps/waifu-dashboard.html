<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panther Waifu Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --foreground: #0A0A0A;
      --muted-foreground: #6B6B6B;
      --accent: #00C805;
      --border: #E8E8E8;
      --card: #F8F8F7;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Geist', sans-serif;
      background: #0A0A0A;
      color: var(--foreground);
      margin: 0;
      min-height: 100vh;
    }
    .bg-marble {
      background-image: url('/home-bg.jpg');
      background-size: cover;
      background-position: center;
    }
    .glass {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .border-custom {
      border-color: #E8E8E8;
    }
    .accent-btn {
      background: var(--accent);
      color: white;
    }
    .waifu-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      transition: all 0.2s ease;
    }
    .waifu-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(0, 200, 5, 0.15);
    }
    .surge-glow {
      box-shadow: 0 0 20px rgba(255, 107, 0, 0.45);
    }
    .pulse-anim {
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .robinhood-ring {
      box-shadow: 0 0 20px rgba(0, 200, 5, 0.4);
    }
  </style>
</head>
<body>
  <div class="bg-marble min-h-screen p-6">
    <!-- Header -->
    <header class="mb-8">
      <div class="flex items-center gap-4">
        <div class="waifu-card rounded-xl p-4 flex items-center gap-3">
          <img src="/assets/mapped/alina.png" alt="Alina" class="size-12 rounded-full object-contain">
          <div>
            <div class="font-semibold text-xl">Boss Alina</div>
            <div class="text-[11px] text-[#6B6B6B]">Leader — Panther Digital</div>
          </div>
        </div>
        <div class="waifu-card rounded-xl p-4 flex-1">
          <div class="flex items-center gap-2">
            <span class="text-[11px] font-bold text-[#00C805]">5 Waifus</span>
            <span class="text-[10px] text-[#6B6B6B]">· Boss Alina → Head Rias</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Waifu Cards Grid -->
    <div class="grid grid-cols-2 gap-4 mb-8">
      <!-- Rias - Head Worker -->
      <div class="waifu-card glass rounded-xl p-4 text-center">
        <div class="size-20 mx-auto mb-2">👑</div>
        <div class="font-medium">Rias</div>
        <div class="text-[10px] text-[#6B6B6B]">Head Worker — UX/Navi</div>
        <div class="mt-2">
          <span class="rounded-full bg-[#0A0A0A] px-2 py-0.5 text-[9px] font-bold text-white">6h</span>
          <span class="text-[9px] text-[#6B6B6B]">auth</span>
        </div>
      </div>

      <!-- Kuro - Market -->
      <div class="waifu-card glass rounded-xl p-4 text-center">
        <div class="size-20 mx-auto mb-2">🐆</div>
        <div class="font-medium">Kuro</div>
        <div class="text-[10px] text-[#6B6B6B]">Market — 30m</div>
        <div class="mt-2">
          <span class="rounded-full bg-[#0A0A0A] px-2 py-0.5 text-[9px] font-bold text-white">30m</span>
          <span class="text-[9px] text-[#6B6B6B]">market</span>
        </div>
      </div>

      <!-- Hikari - Ticker -->
      <div class="waifu-card glass rounded-xl p-4 text-center">
        <div class="size-20 mx-auto mb-2">✨</div>
        <div class="font-medium">Hikari</div>
        <div class="text-[10px] text-[#6B6B6B]">Ticker — 2h</div>
        <div class="mt-2">
          <span class="rounded-full bg-[#0A0A0A] px-2 py-0.5 text-[9px] font-bold text-white">2h</span>
          <span class="text-[9px] text-[#6B6B6B]">ticker</span>
        </div>
      </div>

      <!-- Mio - Auth -->
      <div class="waifu-card glass rounded-xl p-4 text-center">
        <div class="size-20 mx-auto mb-2">🔐</div>
        <div class="font-medium">Mio</div>
        <div class="text-[10px] text-[#6B6B6B]">Auth/Privy</div>
        <div class="mt-2">
          <span class="rounded-full bg-[#0A0A0A] px-2 py-0.5 text-[9px] font-bold text-white">6h</span>
          <span class="text-[9px] text-[#6B6B6B]">auth</span>
        </div>
      </div>
    </div>

    <!-- Schedules -->
    <div class="grid grid-cols-2 gap-2 mb-6">
      <div class="glass rounded-xl p-3 text-center">
        <div class="text-[10px] font-bold">Market</div>
        <div class="text-[11px]">Every 30 minutes</div>
      </div>
      <div class="glass rounded-xl p-3 text-center">
        <div class="text-[10px] font-bold">Ticker</div>
        <div class="text-[11px]">Every 2 hours</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="glass rounded-xl p-4 mb-6">
      <button class="accent-btn rounded-full px-6 py-2.5 font-semibold text-sm">
        Open Full Radar →
      </button>
      <button class="rounded-full border border-[#E8E8E8] bg-white px-6 py-2.5 text-sm hover:bg-[#F8F8F7] transition">
        Refresh Data
      </button>
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-center text-[10px] tracking-[0.2em] text-[#9A9A9A]">
      © PANTHERDIGITAL — WAIFU SQUAD · BOSS ALINA → HEAD RIAS
    </footer>
  </div>

  <script>
    // Initialize waifu dashboard
    document.addEventListener('DOMContentLoaded', () => {
      // Pulse animation for active elements
      const pulseElements = document.querySelectorAll('.pulse-anim');
      pulseElements.forEach(el => {
        el.classList.add('pulse-anim');
      });

      // Hover effects for waifu cards
      const waifuCards = document.querySelectorAll('.waifu-card');
      waifuCards.forEach(card => {
        card.addEventListener('mouseenter', () => {
          card.style.transform = 'translateY(-4px)';
          card.style.transition = 'all 0.2s ease';
        });
        card.addEventListener('mouseleave', () => {
          card.style.transform = 'translateY(0)';
        });
      });

      // Robinhood ring glow on hover
      const rhElements = document.querySelectorAll('.robinhood-ring');
      rhElements.forEach(el => {
        el.addEventListener('mouseenter', () => {
          el.style.boxShadow = '0 0 25px rgba(0, 200, 5, 0.5)';
        });
        el.addEventListener('mouseleave', () => {
          el.style.boxShadow = '0 0 20px rgba(0, 200, 5, 0.4)';
        });
      });
    });
  </script>
</body>
</html>
