import type { PnthrOptions, RequestOptions } from './types'

const DEFAULT_BASE = 'https://api.pnthr.dgtl'

export class Pnthr {
  private apiKey: string
  private baseUrl: string
  private appId?: string
  private fetch: typeof globalThis.fetch

  constructor(opts: PnthrOptions) {
    if (!opts.apiKey) throw new Error('apiKey required')
    this.apiKey = opts.apiKey
    this.baseUrl = opts.baseUrl?.replace(/\\/$/, '') ?? DEFAULT_BASE
    this.appId = opts.appId
    this.fetch = opts.fetch ?? globalThis.fetch.bind(globalThis)
  }

  async request<T>(
    path: string,
    init: RequestInit & RequestOptions = {}
  ): Promise<T> {
    const {
      retries = 2,
      idempotencyKey,
      timeoutMs = 15_000,
      ...fetchInit
    } = init as any

    const url = path.startsWith('http') ? path : \`\${this.baseUrl}\${path}\`
    const headers = new Headers(fetchInit.headers)

    headers.set('Authorization', \`Bearer \${this.apiKey}\`)
    headers.set('Content-Type', 'application/json')
    headers.set('X-PNTHR-SDK', '@pnthr/core@0.1.0')
    if (this.appId) headers.set('X-App-Id', this.appId)
    if (idempotencyKey) headers.set('Idempotency-Key', idempotencyKey)

    let attempt = 0
    while (true) {
      const controller = new AbortController()
      const timer = setTimeout(() => controller.abort(), timeoutMs)

      try {
        const res = await this.fetch(url, {
          ...fetchInit,
          headers,
          signal: controller.signal,
        })

        if (res.status === 429) {
          const retryAfter = Number(res.headers.get('Retry-After') ?? '1')
          if (attempt < retries) {
            await sleep(Math.min(1000 * retryAfter, 5000) * (attempt + 1))
            attempt++; continue
          }
        }

        if (!res.ok) {
          const body = await safeJson(res)
          throw PnthrError.fromResponse(res.status, body, path)
        }

        return (await res.json()) as T
      } catch (err: any) {
        if (err instanceof PnthrError && !err.retryable) throw err
        if (attempt >= retries) throw err
        await sleep(backoff(attempt))
        attempt++
      } finally {
        clearTimeout(timer)
      }
    }
  }

  // typed resource accessors
  get markets() { return new MarketsResource(this) }
  get wallet() { return new WalletResource(this) }
  get signals() { return new SignalsResource(this) }
}

function backoff(n: number) {
  const base = 250 * Math.pow(2, n)
  return base + Math.random() * 150
}
function sleep(ms: number) { return new Promise(r => setTimeout(r, ms)) }
async function safeJson(r: Response) { try { return await r.json() } catch { return null } }

// placeholder resources for typing
class MarketsResource { constructor(private c: Pnthr) {} 
  list = (q?: any) => this.c.request('/v1/markets', { method: 'GET' })
}
class WalletResource { constructor(private c: Pnthr) {} }
class SignalsResource { constructor(private c: Pnthr) {} }

  | 'UNAUTHORIZED'
  | 'RATE_LIMITED'
  | 'VALIDATION_ERROR'
  | 'NOT_FOUND'
  | 'CONFLICT'
  | 'SERVER_ERROR'
  | 'NETWORK_ERROR'

export class PnthrError extends Error {
  constructor(
    public code: ErrorCode,
    message: string,
    public status: number,
    public retryable: boolean,
    public path: string,
    public details?: unknown
  ) {
    super(message)
    this.name = 'PnthrError'
  }

  static fromResponse(status: number, body: any, path: string) {
    const codeMap: Record<number, ErrorCode> = {
      401: 'UNAUTHORIZED',
      404: 'NOT_FOUND',
      409: 'CONFLICT',
      422: 'VALIDATION_ERROR',
      429: 'RATE_LIMITED',
    }
    const code = codeMap[status] ?? (status >= 500 ? 'SERVER_ERROR' : 'VALIDATION_ERROR')
    return new PnthrError(
      code,
      body?.message ?? body?.error ?? \`Request failed \${status}\`,
      status,
      status === 429 || status >= 500,
      path,
      body
    )
  }
}

  url: string
  apiKey: string
  onMessage: (msg: any) => void
  getResumeToken?: () => string | undefined
}

export function createSocket({ url, apiKey, onMessage, getResumeToken }: WSOptions) {
  let ws: WebSocket | null = null
  let attempt = 0
  let closedIntentionally = false

  function connect() {
    const token = getResumeToken?.()
    const u = new URL(url)
    if (token) u.searchParams.set('resume', token)
    ws = new WebSocket(u.toString(), ['pnthr-v1'])

    ws.addEventListener('open', () => {
      attempt = 0
      ws!.send(JSON.stringify({ type: 'auth', apiKey }))
    })

    ws.addEventListener('message', (ev) => {
      try { onMessage(JSON.parse(ev.data)) } catch {}
    })

    ws.addEventListener('close', () => {
      if (closedIntentionally) return
      const delay = Math.min(1000 * Math.pow(1.8, attempt), 15000) + Math.random() * 300
      attempt++
      setTimeout(connect, delay)
    })
  }

  connect()

  return {
    send: (data: unknown) => ws?.readyState === 1 && ws.send(JSON.stringify(data)),
    close: () => { closedIntentionally = true; ws?.close() }
  }
}

export class TokenBucket {
  private tokens: number
  private last: number
  constructor(private max: number, private perMs: number) {
    this.tokens = max
    this.last = Date.now()
  }
  take(): boolean {
    const now = Date.now()
    const elapsed = now - this.last
    this.tokens = Math.min(this.max, this.tokens + (elapsed / this.perMs) * this.max)
    this.last = now
    if (this.tokens >= 1) { this.tokens -= 1; return true }
    return false
  }
}

export type EIP1193Provider = {
  request: (args: { method: string; params?: any[] }) => Promise<any>
  on?: (event: string, handler: (...a: any[]) => void) => void
  removeListener?: (event: string, handler: (...a: any[]) => void) => void

export class WalletAdapter {
  constructor(private provider: EIP1193Provider) {}

  async connect(): Promise<{ address: string; chainId: string }> {
    const [address] = await this.provider.request({ method: 'eth_requestAccounts' })
    const chainId = await this.provider.request({ method: 'eth_chainId' })
    return { address, chainId }
  }

  async signMessage(message: string, address: string) {
    return this.provider.request({
      method: 'personal_sign',
      params: [message, address],
    }) as Promise<\`0x\${string}\`>
  }

  async sendTransaction(tx: { to: string; data?: string; value?: string }) {
    return this.provider.request({
      method: 'eth_sendTransaction',
      params: [tx],
    })
  }

  async simulate(tx: any) {
    // server-side simulation via core client
    return { ok: true, gasUsed: '21000', preview: tx }
  }
}

export class Markets {
  constructor(private client: Pnthr) {}

  list(params?: { chain?: string; limit?: number; cursor?: string }) {

    return this.client.request<{ data: Market[]; nextCursor?: string }>(\`/v1/markets?\${q}\`)

    marketId: string,
    onSignal: (s: Signal) => void,
    opts?: { resumeToken?: string }
  ) {
    const { createSocket } = require('@pnthr/core/ws')
    let lastId = opts?.resumeToken
    const sock = createSocket({
      url: 'wss://api.pnthr.dgtl/v1/signals/stream',
      apiKey: (this.client as any).apiKey,
      getResumeToken: () => lastId,
      onMessage: (msg: any) => {
        if (msg.type === 'signal') {
          lastId = msg.data.id
          onSignal(msg.data as Signal)
        }
      }
    })
    // auto-subscribe
    setTimeout(() => sock.send({ type: 'subscribe', marketId }), 200)
    return () => sock.close()
  }
}

// wallet hook
export function useWallet(adapter: { connect: () => Promise<any>; provider: any }) {
  const [state, setState] = useState<{ address?: string; chainId?: string; status: 'idle'|'connecting'|'connected' }>({

  const connect = async () => {
    setState(s => ({ ...s, status: 'connecting' }))
    const res = await adapter.connect()
    setState({ ...res, status: 'connected' })
  }

  return { ...state, connect, isConnected: state.status === 'connected' }
}

export function useMarkets(fetcher: () => Promise<{ data: Market[] }>) {
  const [data, setData] = useState<Market[]>([])
  useEffect(() => { fetcher().then(r => setData(r.data)) }, [])
  return { markets: data, isLoading: data.length === 0 }
}

  const [signals, setSignals] = useState<Signal[]>([])
  useEffect(() => {
    return subscribe((s) => setSignals(prev => [s, ...prev].slice(0, 100))
  )}, [subscribe])
  return signals
}
